name: Auto-moderate Staticman comment PRs

# Strategy:
#  - On PR open: run a content heuristic on the added comment YAML.
#      * heuristic says spam → close immediately.
#      * heuristic says clean → leave open, wait for Copilot.
#  - On Copilot review/comment (any type): re-evaluate everything.
#      * heuristic says spam OR Copilot text says "spam" → close.
#      * otherwise → merge (clean + Copilot actually reviewed).
#  - Hourly schedule: safety net for PRs Copilot never reviews.
#      Older than MIN_AGE_FOR_MERGE_MINUTES → merge only with an explicit
#      Akismet "not spam" verdict; otherwise flag for manual moderation.
#
# This means we don't trust Copilot for the primary spam verdict (it has
# proven unreliable — it often just describes the PR without classifying).
# The diff-content heuristic is the workhorse; Copilot is a backup.
#
# Auto-merge requires a POSITIVE clean signal, never merely the absence of a
# spam one. In 2026-06/07 Copilot ran out of quota and answered every PR with
# a review-shaped stub ("unable to review ... quota limit"); the old gate
# counted that as "Copilot has weighed in" and merged eight spam comments
# within ~10s of submission. Such stubs no longer count as a review, and a PR
# with no real signal is now held for a human instead of merged.

on:
  pull_request:
    types: [opened, reopened, synchronize]
  pull_request_review:
    types: [submitted]
  pull_request_review_comment:
    types: [created]
  issue_comment:
    types: [created]
  schedule:
    - cron: '17 * * * *'  # hourly safety net
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'If true, only log decisions; do not merge/close.'
        required: false
        default: 'false'

permissions:
  contents: write
  pull-requests: write

jobs:
  moderate:
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate PR(s) and act
        uses: actions/github-script@v7
        env:
          MIN_AGE_FOR_MERGE_MINUTES: '60'
          AKISMET_API_KEY: ${{ secrets.AKISMET_API_KEY }}
          AKISMET_BLOG_URL: 'https://www.cs.toronto.edu/~mmozaffari/'
          AKISMET_USER_AGENT: 'mmozaffari-blog-comments/1.0 | Akismet-Action'
        with:
          script: |
            const { owner, repo } = context.repo;
            const dryRun = (context.payload.inputs?.dry_run === 'true');
            const MIN_AGE_MIN = Number(process.env.MIN_AGE_FOR_MERGE_MINUTES || 60);
            const AKISMET_KEY = process.env.AKISMET_API_KEY || '';
            const AKISMET_BLOG = process.env.AKISMET_BLOG_URL || '';
            const AKISMET_UA = process.env.AKISMET_USER_AGENT || 'akismet-action/1.0';

            // ---- Heuristic spam regex. Tuned to the spam this repo actually
            // receives (Portuguese/Spanish/etc. gambling+casino content). The
            // blog is about ML/LLM compression — these terms have ~zero chance
            // of appearing in a legitimate comment.
            const SPAM_RE = new RegExp([
              // Slot/casino game titles
              'fortune\\s*(tiger|ox|rabbit|mouse|dragon|gods?)',
              'wild\\s*bandito',
              'wild\\s*wild\\s*riches',
              'lucky\\s*neko',
              'mahjong\\s*ways',
              'ganesha\\s*gold',
              'jewel\\s*race',
              'pinata\\s*wins',
              'buffalo\\s*win',
              'piggy\\s*gold',
              'leprechaun\\s*riches',
              'gem\\s*saviour',
              'dragon\\s*hatch',
              'dim\\s*sum\\s*prize',
              'sweet\\s*bonanza',
              'gates\\s*of\\s*olympus',
              'sugar\\s*rush',
              'crazy\\s*time',
              '\\baviator\\b',
              '\\bplinko\\b',
              'emperor.?s\\s*favou?r',
              'big\\s*bass',
              '\\bspaceman\\b',
              '\\bjetx\\b',
              'tigrinho',
              'jogo\\s*do\\s*tigrinho',
              'pg\\s*(soft|slot)',
              'slot\\s*(demo|gratis|grátis|machine)',
              'slots?\\s+eleg[ií]veis',
              'bombom',
              'ninja\\s*vs\\s*samurai',
              // Casino / gambling vocabulary
              'cas[si]nos?',
              'roleta',
              'usdt',
              'giros\\s*gr[áa]tis',
              'b[oô]nus',
              // Spammy author-name / link-bait patterns
              'trustguru',
              'betano',
              'view\\s*details',
              'ver\\s*detalles',
              'm[áa]s\\s*informaci[óo]n',
              'clique\\s*aqui',
              'confira\\s*aqui',
              'click\\s*here',
              '\\bkunjungi\\b',
              'i-click\\s*dito',
              'redaç[ãa]o\\s*TrustGuru',
              'redacci[óo]n\\s*TrustGuru',
              'redaksi\\s*TrustGuru',
              'editoryal\\s*ng\\s*TrustGuru',
              'melhores\\s*cassinos',
              'app\\s*jogos',
              'online\\s*casino',
              'jogo-do-tigrinho',
              'melhores-cassinos',
              'casino\\s*plus\\s*pagcor',
              '888-?casino',
              '888\\s*bet',
              '\\ba5game\\b',
              'pinata-wins',
              'fortune-tiger',
              'buffalo-win',
              'desativar-modo-desenvolvedor',
              // Gambling-community jargon that catches the subtler spam
              'pre-session',
              'discord\\s+groups',
              '\\bhit-?rate\\b',
              '\\bsession\\s+(roi|hit)',
              'stop\\s*(gain|loss)',
              'turbo\\s+mode',
              'taxa\\s+de\\s+hit',
              'fechei\\s+em\\s+r\\$',
              'galera\\s+(dos?\\s+dados|mais\\s+antiga)',
              'compra\\s+de\\s+b[oô]nus',
              // Brazilian-real money amounts in messages are a strong gambling signal
              // on an English-language ML blog.
              'r\\$\\s*\\d+',
              // Sports-betting vocabulary
              'world\\s+cup',
              '\\bqualifiers\\b',
              'consolation\\s+goals?',
              'late\\s+strikes?',
              // Chinese TV-piracy / streaming spam
              'aiyifan',
              '高清完整版',
              '美剧',
              '海外华人',
              '第.\\s*季',
              // Generic link-bait author names
              '\\bcomparativos?\\b',
              '\\buptodown\\b',
              '\\bx\\d+games?\\b',
              'gest[ãa]o\\s+de\\s+banca',
              'और\\s*देखें',  // "see more" (Hindi link-bait)
              'अधिक\\s*देखें',
              // --- 2026-06/07 wave: softer gambling / fantasy-sports spam that
              // slipped past every pattern above (PRs #313 #319 #341 #344 #346
              // #375 #383 #406). Kept narrow enough not to fire on ML prose.
              'jogo\\s*d[oe]\\s*tigr\\w*',
              '\\btigrinho?\\b',
              '\\btigre\\b',
              'tiger\\s*(demo|slot|bet)',
              'treasures?\\s*of\\s*aztec',
              // Betting operators / brands
              '\\bbetway\\b',
              '\\bbet\\s*365\\b',
              '\\b1xbet\\b',
              '\\bbetfair\\b',
              'blaze\\s*(strategy|bet|double|crash|apostas?)',
              'luck\\s*bet',
              // Indonesian / Malay gambling vocabulary
              'judi\\s*(online|bola|slot)',
              'piala\\s*dunia',
              'jadwal\\s*(piala|bola|slot)',
              '\\bwordwall\\b',
              // Portuguese betting vocabulary
              'free\\s*bets?',
              '\\bapostas?\\b',
              '\\bapostar\\b',
              'odds\\s*ao\\s*vivo',
              'melhores\\s*slots?',
              'slots?\\s*(gr[áa]tis|online|pagando|20\\d\\d)',
              '\\bmilz[ãa]o\\b',
              'controle\\s*emocional',
              // Fantasy cricket / rummy link-bait
              '\\brummy\\b',
              'vice-?captain',
              'dream\\s*11\\b',
              'fantasy\\s*(cricket|team|league|xi|11)',
              'playing\\s*(xi|11)\\b',
              'icc\\s*(playing|world|t20|odi)',
              '\\bt20\\s*(world\\s*cup|league|blast|match)',
              '\\bipl\\s*20\\d\\d\\b',
            ].join('|'), 'i');

            const isCopilot = (login) => /^copilot(\b|-|\[)/i.test(login || '');

            // Copilot posts a review-shaped placeholder when it cannot actually
            // review the PR — most often because the requesting user is out of
            // quota. That is not a review, and must not satisfy the merge gate.
            const COPILOT_NO_REVIEW_RE =
              /(unable to review|couldn'?t review|can ?not review|quota limit|rate limit)/i;

            const MANUAL_MARKER = '<!-- auto-moderate:needs-manual-review -->';

            async function flagForManualReview(prNumber, why) {
              await github.rest.issues.addLabels({
                owner, repo, issue_number: prNumber, labels: ['needs-manual-review'],
              }).catch((e) => core.warning(`Label failed for #${prNumber}: ${e.message}`));
              const existing = await github.paginate(
                github.rest.issues.listComments,
                { owner, repo, issue_number: prNumber, per_page: 100 }
              );
              if (existing.some((c) => (c.body || '').includes(MANUAL_MARKER))) return;
              await github.rest.issues.createComment({
                owner, repo, issue_number: prNumber,
                body: `${MANUAL_MARKER}\nHeld for manual moderation: ${why}, and no `
                  + `independent clean signal was available, so this PR will not be `
                  + `auto-merged. Please check the comment content and merge or close it.`,
              }).catch((e) => core.warning(`Comment failed for #${prNumber}: ${e.message}`));
            }

            async function fetchAddedComments(prNumber) {
              // Returns { rawAdded, comments: [{ slug, name, message }] }
              const files = await github.paginate(
                github.rest.pulls.listFiles,
                { owner, repo, pull_number: prNumber, per_page: 100 }
              );
              const rawAddedParts = [];
              const comments = [];
              for (const f of files) {
                const m = f.filename.match(/^_data\/comments\/([^/]+)\/.*\.ya?ml$/);
                if (!m) continue;
                const slug = m[1];
                const patch = f.patch || '';
                const added = patch.split('\n')
                  .filter((l) => l.startsWith('+') && !l.startsWith('+++'))
                  .map((l) => l.slice(1))
                  .join('\n');
                rawAddedParts.push(added);
                const parsed = parseStaticmanYaml(added);
                comments.push({ slug, name: parsed.name || '', message: parsed.message || '' });
              }
              return { rawAdded: rawAddedParts.join('\n'), comments };
            }

            // Minimal YAML parser tuned to Staticman's output. Handles
            // scalar values, quoted strings, and `>-` / `|` block scalars.
            function parseStaticmanYaml(text) {
              const out = {};
              const lines = text.split('\n');
              let i = 0;
              while (i < lines.length) {
                const m = lines[i].match(/^([A-Za-z_][\w]*):\s*(.*)$/);
                if (!m) { i++; continue; }
                const key = m[1];
                let val = m[2].trim();
                if (val.startsWith('>') || val.startsWith('|')) {
                  i++;
                  const acc = [];
                  while (i < lines.length && (/^\s{2,}/.test(lines[i]) || lines[i].trim() === '')) {
                    acc.push(lines[i].trim());
                    i++;
                  }
                  out[key] = acc.join(' ').trim();
                  continue;
                }
                if ((val.startsWith("'") && val.endsWith("'")) ||
                    (val.startsWith('"') && val.endsWith('"'))) {
                  val = val.slice(1, -1);
                }
                out[key] = val;
                i++;
              }
              return out;
            }

            async function akismetSaysSpam(name, message, slug) {
              if (!AKISMET_KEY || !AKISMET_BLOG) return null; // not configured
              const params = new URLSearchParams({
                api_key: AKISMET_KEY,
                blog: AKISMET_BLOG,
                user_ip: '127.0.0.1',
                user_agent: 'staticman-comment-submission',
                referrer: AKISMET_BLOG,
                comment_type: 'comment',
                comment_author: name,
                comment_content: message,
                blog_lang: 'en',
                blog_charset: 'UTF-8',
              });
              if (slug) params.set('permalink', AKISMET_BLOG.replace(/\/?$/, '/') + slug + '/');
              const url = `https://${AKISMET_KEY}.rest.akismet.com/1.1/comment-check`;
              try {
                const r = await fetch(url, {
                  method: 'POST',
                  headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                    'User-Agent': AKISMET_UA,
                  },
                  body: params.toString(),
                });
                const body = (await r.text()).trim();
                if (body === 'true') return true;
                if (body === 'false') return false;
                core.warning(`Akismet returned unexpected body: "${body}" (status ${r.status})`);
                return null;
              } catch (e) {
                core.warning(`Akismet call failed: ${e.message}`);
                return null;
              }
            }

            async function fetchCopilotText(prNumber) {
              const parts = [];
              const reviews = await github.paginate(
                github.rest.pulls.listReviews,
                { owner, repo, pull_number: prNumber, per_page: 100 }
              );
              for (const r of reviews) if (isCopilot(r.user?.login)) parts.push(r.body || '');
              const inline = await github.paginate(
                github.rest.pulls.listReviewComments,
                { owner, repo, pull_number: prNumber, per_page: 100 }
              );
              for (const c of inline) if (isCopilot(c.user?.login)) parts.push(c.body || '');
              const issueComments = await github.paginate(
                github.rest.issues.listComments,
                { owner, repo, issue_number: prNumber, per_page: 100 }
              );
              for (const c of issueComments) if (isCopilot(c.user?.login)) parts.push(c.body || '');
              const copilotReviews = reviews.filter((r) => isCopilot(r.user?.login));
              const realReviews = copilotReviews.filter(
                (r) => (r.body || '').trim() && !COPILOT_NO_REVIEW_RE.test(r.body)
              );
              return {
                text: parts.join('\n'),
                hasRealReview: realReviews.length > 0,
                stubbed: copilotReviews.length > 0 && realReviews.length === 0,
              };
            }

            async function evaluate(prNumber, opts = {}) {
              const { allowMergeWithoutCopilot = false } = opts;
              const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: prNumber });
              if (pr.state !== 'open') {
                core.info(`PR #${prNumber}: not open, skipping.`);
                return;
              }

              const { rawAdded, comments } = await fetchAddedComments(prNumber);
              if (!rawAdded) {
                core.info(`PR #${prNumber}: no _data/comments YAML changes, skipping.`);
                return;
              }
              const heuristicSpam = SPAM_RE.test(rawAdded);

              const { text: copilotText, hasRealReview: copilotReviewed, stubbed: copilotStubbed } =
                await fetchCopilotText(prNumber);
              // Don't let a review that says "this is not spam" trip the check.
              const copilotSpam = /\bspam\b/i.test(copilotText)
                && !/\b(not|isn'?t|no)\s+spam\b/i.test(copilotText);

              // Stage 2: ask Akismet only if the cheap regex check didn't already
              // flag it. akismetVerdict is true = spam, false = confirmed clean,
              // null = no answer (key missing, network error, odd response body).
              // Only an explicit `false` counts as a positive clean signal below.
              let akismetVerdict = null;
              if (!AKISMET_KEY) {
                core.warning('AKISMET_API_KEY is not set — Akismet stage skipped.');
              } else if (!heuristicSpam) {
                for (const c of comments) {
                  const v = await akismetSaysSpam(c.name, c.message, c.slug);
                  if (v === true) { akismetVerdict = true; break; }
                  if (v === false && akismetVerdict === null) akismetVerdict = false;
                }
              }
              const akismetSpam = akismetVerdict === true;

              const isSpam = heuristicSpam || copilotSpam || akismetSpam;
              core.info(`PR #${prNumber}: heuristicSpam=${heuristicSpam} akismetVerdict=${akismetVerdict} copilotSpam=${copilotSpam} copilotReviewed=${copilotReviewed} copilotStubbed=${copilotStubbed}`);

              if (dryRun) return;

              if (isSpam) {
                const reason = heuristicSpam
                  ? 'Auto-closing: comment content matched spam heuristic.'
                  : (akismetSpam
                    ? 'Auto-closing: Akismet classified this submission as spam.'
                    : 'Auto-closing: Copilot flagged this submission as spam.');
                await github.rest.issues.createComment({ owner, repo, issue_number: prNumber, body: reason });
                await github.rest.pulls.update({ owner, repo, pull_number: prNumber, state: 'closed' });
                if (pr.head.repo && pr.head.repo.full_name === `${owner}/${repo}`) {
                  await github.rest.git.deleteRef({ owner, repo, ref: `heads/${pr.head.ref}` })
                    .catch((e) => core.warning(`Branch delete failed: ${e.message}`));
                }
                return;
              }

              // Clean so far. Auto-merge needs a POSITIVE clean signal, never
              // just the absence of a spam one:
              //   * a real Copilot review that did not call it spam, or
              //   * (stale PRs only) an explicit Akismet "not spam" verdict.
              // A Copilot stub ("unable to review ... quota limit") is not a
              // review. With no signal at all the PR is held for a human.
              const positiveClean =
                copilotReviewed || (allowMergeWithoutCopilot && akismetVerdict === false);
              if (!positiveClean) {
                const why = copilotStubbed
                  ? 'Copilot could not review this PR (quota exhausted or unavailable)'
                  : 'no Copilot review yet';
                core.info(`PR #${prNumber}: heuristics clean but ${why} — not auto-merging.`);
                if (allowMergeWithoutCopilot) await flagForManualReview(prNumber, why);
                return;
              }

              await github.rest.pulls.merge({
                owner, repo, pull_number: prNumber, merge_method: 'merge',
              }).catch((e) => core.warning(`Merge failed for #${prNumber}: ${e.message}`));
            }

            // Decide which PRs to process based on the triggering event.
            const event = context.eventName;
            let targets = [];

            if (event === 'pull_request') {
              targets.push({ num: context.payload.pull_request.number });
            } else if (event === 'pull_request_review' || event === 'pull_request_review_comment') {
              targets.push({ num: context.payload.pull_request.number });
            } else if (event === 'issue_comment') {
              if (context.payload.issue.pull_request) {
                targets.push({ num: context.payload.issue.number });
              }
            } else if (event === 'schedule' || event === 'workflow_dispatch') {
              const open = await github.paginate(github.rest.pulls.list, {
                owner, repo, state: 'open', per_page: 100,
              });
              const cutoff = Date.now() - MIN_AGE_MIN * 60 * 1000;
              targets = open.map((p) => ({
                num: p.number,
                // Stale PRs (older than MIN_AGE_MIN with no Copilot review)
                // are allowed to merge without waiting for Copilot.
                allowMergeWithoutCopilot: new Date(p.created_at).getTime() < cutoff,
              }));
            }

            core.info(`Event=${event}, evaluating ${targets.length} PR(s). dryRun=${dryRun}`);
            for (const t of targets) {
              try {
                await evaluate(t.num, { allowMergeWithoutCopilot: !!t.allowMergeWithoutCopilot });
              } catch (e) {
                core.warning(`PR #${t.num}: ${e.message}`);
              }
            }
